[build]
builder = "RAILPACK"

[deploy]
# Start gerado pelo Railpack (start-container.sh): roda `php artisan migrate --force`
# no boot + inicia o FrankenPHP com document root /public — NÃO sobrescrever com startCommand.
# Healthcheck: rota /up registrada no bootstrap/app.php
healthcheckPath = "/up"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Nota: variáveis de template (prompts do wizard) são configuradas na UI do
# Railway ao criar/publicar o template (Dashboard → Templates), NÃO aqui.
